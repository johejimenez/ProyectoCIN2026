<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-navy: #0b2742;
      --brand-cyan: #0ea5a5;
      --brand-gold: #f59e0b;
      --bg-soft: #f4f7fb;
      --text-dark: #12263a;
      --text-soft: #4a5a6a;
      --panel: #ffffff;
      --faculty-primary: #0b2742;
      --faculty-secondary: #0f4b72;
      --faculty-soft: #eef4fb;
      --faculty-primary-rgb: 11, 39, 66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 8% 10%, rgba(14, 165, 165, 0.11), transparent 25%),
        radial-gradient(circle at 90% 18%, rgba(245, 158, 11, 0.15), transparent 20%),
        linear-gradient(180deg, #f8fbff 0%, #eef4fa 100%);
      min-height: 100vh;
    }

    h1, h2, h3, h4 {
      font-family: "Sora", sans-serif;
      margin: 0;
    }

    .shell {
      width: min(1600px, 94vw);
      margin: 0 auto;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(8px);
      background: linear-gradient(90deg, rgba(11, 39, 66, 0.95), rgba(6, 78, 125, 0.9));
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .menu-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 39, 66, 0.36);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 45;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: min(360px, 88vw);
      height: 100vh;
      padding: 22px;
      background: #ffffff;
      border-right: 1px solid #dbe5ef;
      box-shadow: 0 20px 50px rgba(11, 39, 66, 0.18);
      transform: translateX(-102%);
      transition: transform 0.28s ease;
      z-index: 50;
      overflow-y: auto;
    }

    body.drawer-open .drawer {
      transform: translateX(0);
    }

    body.drawer-open .drawer-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    body.drawer-open {
      overflow: hidden;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .drawer-close {
      border: 1px solid #d9e4ee;
      background: #f5f9ff;
      color: #29445d;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      cursor: pointer;
    }

    .nav-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-block-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5b6b7b;
      margin-bottom: 2px;
    }

    .content-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .tab-scroll {
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }

    .main-tab {
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.06);
      transition: 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.24);
      flex: 0 0 auto;
    }

    .main-tab:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.15);
    }

    .main-tab.active {
      color: #052130;
      background: linear-gradient(120deg, var(--faculty-secondary), var(--faculty-primary));
      color: #ffffff;
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(var(--faculty-primary-rgb), 0.25);
    }

    .drawer .main-tab,
    .drawer .sub-tab {
      width: 100%;
      text-align: left;
      white-space: normal;
      border-radius: 14px;
      padding: 12px 14px;
    }

    .drawer .main-tab {
      color: #29445d;
      background: #f5f9ff;
      border: 1px solid #d9e4ee;
    }

    .drawer .main-tab:hover {
      background: #ebf2fa;
    }

    .drawer .main-tab.active {
      color: #fff;
      background: linear-gradient(120deg, var(--faculty-secondary), var(--faculty-primary));
      border-color: transparent;
      box-shadow: 0 10px 18px rgba(var(--faculty-primary-rgb), 0.28);
    }

    .panel {
      background: var(--panel);
      border: 1px solid #dde6ef;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(11, 39, 66, 0.08);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--faculty-primary), var(--faculty-secondary));
      opacity: 0.75;
    }

    .sub-tab {
      border: 1px solid #d9e4ee;
      color: #29445d;
      background: #f5f9ff;
      transition: 0.2s ease;
    }

    .sub-tab.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(120deg, var(--faculty-secondary), var(--faculty-primary));
      box-shadow: 0 10px 18px rgba(var(--faculty-primary-rgb), 0.25);
    }

    @media (max-width: 1024px) {
      .content-header {
        flex-direction: column;
      }
    }

    .program-card {
      background: #fff;
      border: 1px solid #dde6ef;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: riseIn 0.6s ease both;
    }

    .program-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 28px rgba(11, 39, 66, 0.16);
    }

    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-high {
      background: rgba(34, 197, 94, 0.16);
      color: #166534;
    }

    .pill-growth {
      background: rgba(59, 130, 246, 0.16);
      color: #1d4ed8;
    }

    .pill-niche {
      background: rgba(148, 163, 184, 0.22);
      color: #334155;
    }

    .pill-saturation {
      background: rgba(249, 115, 22, 0.18);
      color: #c2410c;
    }

    .kpi {
      border-radius: 14px;
      border: 1px solid #dfe9f2;
      background: linear-gradient(160deg, #ffffff, var(--faculty-soft));
    }

    .fade-in {
      animation: fadeIn 0.35s ease both;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #dde7ef;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #edf2f7;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #0b2742;
      background: #f6f9fd;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .placeholder {
      border: 2px dashed #c7d6e6;
      border-radius: 16px;
      background: #f7fbff;
    }

    details > summary {
      list-style: none;
    }

    details > summary::-webkit-details-marker {
      display: none;
    }

    .accordion-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      border: 1px solid rgba(var(--faculty-primary-rgb), 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      background: linear-gradient(120deg, rgba(var(--faculty-primary-rgb), 0.1), rgba(var(--faculty-primary-rgb), 0.03));
      transition: all 0.25s ease;
    }

    .accordion-summary strong {
      color: var(--faculty-primary);
    }

    .accordion-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #5b6b7b;
      font-size: 12px;
      font-weight: 700;
    }

    .accordion-badge {
      border-radius: 999px;
      border: 1px solid rgba(var(--faculty-primary-rgb), 0.22);
      background: #ffffff;
      padding: 2px 8px;
      font-size: 11px;
      color: #3f5368;
    }

    .panel details {
      border: 1px solid #dbe7f2;
      border-radius: 14px;
      padding: 8px;
      background: linear-gradient(180deg, #ffffff, var(--faculty-soft));
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .panel details[open] {
      border-color: rgba(var(--faculty-primary-rgb), 0.32);
      box-shadow: 0 14px 26px rgba(var(--faculty-primary-rgb), 0.12);
      transform: translateY(-1px);
    }

    .panel details > div {
      animation: fadeIn 0.35s ease both;
    }

    .accordion-chevron {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    details[open] .accordion-chevron {
      transform: rotate(180deg);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

      root.style.setProperty("--faculty-primary", t.primary);
      root.style.setProperty("--faculty-secondary", t.secondary);
      root.style.setProperty("--faculty-soft", t.soft);
      root.style.setProperty("--faculty-primary-rgb", t.rgb);
    }

    function init() {
      applyFacultyTheme(currentFaculty);
      renderMainTabs();
      renderSubTabs();
      renderFaculty();
    }

    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      document.body.classList.toggle("drawer-open", drawerOpen);
    }

    function closeDrawer() {
      drawerOpen = false;
      document.body.classList.remove("drawer-open");
    }

    function renderMainTabs() {
      const tabs = document.getElementById("mainTabs");
      tabs.innerHTML = faculties.map((f) => `
        <button class="main-tab active:text-slate-900 rounded-full px-4 py-2 text-xs md:text-sm ${f.id === currentFaculty ? "active" : ""}" onclick="switchFaculty('${f.id}')"><span class="tab-dot" style="background:${getFacultyTheme(f.id).secondary};"></span>${f.name}</button>
      `).join("");
    }

    function renderSubTabs() {
      const sub = document.getElementById("subTabs");
      if (currentFaculty === "contexto") {
        sub.classList.remove("hidden");
        sub.innerHTML = `
          <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "contexto-resumen" ? "active" : ""}" onclick="switchSubtab('contexto-resumen')">Resumen</button>
          <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "contexto-fase1" ? "active" : ""}" onclick="switchSubtab('contexto-fase1')">Fase 1</button>
          <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "contexto-fase2" ? "active" : ""}" onclick="switchSubtab('contexto-fase2')">Fase 2</button>
          <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "contexto-fase3" ? "active" : ""}" onclick="switchSubtab('contexto-fase3')">Fase 3</button>
          <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "contexto-fase4" ? "active" : ""}" onclick="switchSubtab('contexto-fase4')">Fase 4</button>
        `;
        return;
      }

      if (currentFaculty === "consolidado" || currentFaculty === "bases_extraidas") {
        sub.innerHTML = "";
        sub.classList.add("hidden");
        return;
      }
      sub.classList.remove("hidden");
      sub.innerHTML = `
        <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "indice" ? "active" : ""}" onclick="switchSubtab('indice')">Índice de Oportunidad</button>
        <button class="sub-tab rounded-lg px-4 py-2 text-sm ${currentSubtab === "empleabilidad" ? "active" : ""}" onclick="switchSubtab('empleabilidad')">Dashboard de Empleabilidad</button>
      `;
    }

    function switchFaculty(id) {
      currentFaculty = id;
      currentSubtab = id === "contexto" ? "contexto-resumen" : "indice";
      applyFacultyTheme(currentFaculty);
      closeDrawer();
      renderMainTabs();
      renderSubTabs();
      renderFaculty();
    }

    function switchSubtab(tab) {
      currentSubtab = tab;
      renderSubTabs();
      renderFacultyContent();
    }

    function renderFaculty() {
      const faculty = faculties.find((f) => f.id === currentFaculty);
      document.getElementById("facultyTitle").textContent = faculty.name;
      document.getElementById("facultySubtitle").textContent = currentFaculty === "salud"
        ? ""
        : currentFaculty === "contexto"
        ? "Marco del proyecto, metodología del modelo y criterios de interpretación."
        : currentFaculty === "consolidado"
        ? "Vista consolidada de datos estratégicos del tablero."
        : currentFaculty === "bases_extraidas"
        ? "Registro de bases y fuentes extraídas para el análisis."
        : "Estructura lista para cargar información específica por programa.";
      renderFacultyContent();
    }

    function safeDestroyChart(name) {
      if (charts[name]) {
        charts[name].destroy();
      }
    }

    function parseTopMetricItems(items, limit = 10) {
      return (items || [])
        .slice(0, limit)
        .map((item, idx) => {
          const raw = String(item || "").trim();
          const match = raw.match(/^(.*)\((\d+)\)\s*$/);
          if (match) {
            return {
              label: match[1].trim(),
              value: Number(match[2])
            };
          }
          return {
            label: raw,
            value: Math.max(1, limit - idx)
          };
        })
        .filter((x) => x.label.length > 0);
    }

    function buildTopHorizontalChart(chartName, canvasId, items, color) {
      safeDestroyChart(chartName);
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      const rows = items.length ? items : [{ label: "Sin datos", value: 0 }];
      charts[chartName] = new Chart(ctx, {
        type: "bar",
        data: {
          labels: rows.map((r) => r.label),
          datasets: [{
            data: rows.map((r) => r.value),
            backgroundColor: color,
            borderRadius: 6,
            barThickness: 14
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, ticks: { precision: 0 } },
            y: { ticks: { autoSkip: false } }
          }
        }
      });
    }

    function buildEmployabilityTopCharts(facultyPrefix, data, keys) {
      const select = document.getElementById(`${facultyPrefix}TopProgramFilter`);

      const selectedProgram = select.value;
      const empresasItems = parseTopMetricItems((data[keys.empresasKey] || {})[selectedProgram]);
      const cargosItems = parseTopMetricItems((data[keys.cargosKey] || {})[selectedProgram]);
      const competenciasItems = parseTopMetricItems((data[keys.competenciasKey] || {})[selectedProgram]);

      buildTopHorizontalChart(`${facultyPrefix}TopEmpresas`, `${facultyPrefix}TopEmpresasChart`, empresasItems, "#0b2742");
      buildTopHorizontalChart(`${facultyPrefix}TopCargos`, `${facultyPrefix}TopCargosChart`, cargosItems, "#0ea5a5");
      buildTopHorizontalChart(`${facultyPrefix}TopCompetencias`, `${facultyPrefix}TopCompetenciasChart`, competenciasItems, "#f59e0b");
    }
